<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV Search & Rescue - 3D Sim</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b10;
            --bg-surface: rgba(20, 22, 37, 0.8);
            --accent-primary: #7b61ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            /* Required strict hex colors */
            --color-collapse: #4a4a4a;
            --color-wildfire: #8B3A0F;
            --color-flood: #1a3a5c;
            --color-rescued: #00FF88;
            --color-drone: #FFD700;
            --color-unrescued: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { padding: 15px 30px; background: rgba(10, 11, 16, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); }
        h1 { font-weight: 800; font-size: 1.5rem; background: linear-gradient(135deg, #fff, var(--accent-primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .screen { display: none; flex: 1; padding: 20px; overflow: hidden; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Screen 1: Cards */
        .cards-container { display: flex; gap: 20px; margin-top: 30px; }
        .map-card { width: 250px; height: 350px; border-radius: 12px; cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid transparent; }
        .map-card:hover { transform: translateY(-5px); }
        .card-collapse { background: linear-gradient(180deg, rgba(74,74,74,0.3) 0%, rgba(74,74,74,0.8) 100%); border-color: var(--color-collapse); }
        .card-wildfire { background: linear-gradient(180deg, rgba(139,58,15,0.3) 0%, rgba(139,58,15,0.8) 100%); border-color: var(--color-wildfire); }
        .card-flood { background: linear-gradient(180deg, rgba(26,58,92,0.3) 0%, rgba(26,58,92,0.8) 100%); border-color: var(--color-flood); }
        .map-card h2 { font-size: 1.5rem; font-weight: 800; text-align: center; }
        
        /* Buttons */
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background: var(--accent-primary); color: white; margin-top: 20px; display: none; }
        .btn:hover { opacity: 0.9; }
        
        /* Canvas */
        canvas { background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: crosshair; }
        
        /* Screen 3 Layout */
        #screen3 { flex-direction: row; align-items: stretch; gap: 20px; }
        .hud-panel { width: 300px; background: var(--bg-surface); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 15px; }
        
        .stat-box { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-val { font-size: 1.4rem; font-weight: bold; }
        
        .drone-item { display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; }
        
        .log-box { flex: 1; background: #000; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 10px; overflow-y: auto; border-radius: 6px; }
        
        /* 3D Container */
        #sim3d { width: 640px; height: 640px; background: #000; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header>
        <h1>UAV Search & Rescue <span>| 3D Simulation</span></h1>
    </header>

    <!-- SCREEN 1: MAP SELECTION -->
    <div id="screen1" class="screen active">
        <h2>Select Disaster Environment</h2>
        <div class="cards-container">
            <div class="map-card card-collapse" onclick="selectMap('collapse')">
                <h2>Building Collapse</h2>
            </div>
            <div class="map-card card-wildfire" onclick="selectMap('wildfire')">
                <h2>Wildfire Zone</h2>
            </div>
            <div class="map-card card-flood" onclick="selectMap('flood')">
                <h2>Urban Flood</h2>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: VICTIM PLACEMENT -->
    <div id="screen2" class="screen">
        <h2>Place Victims on the Grid</h2>
        <p style="color: var(--text-muted); margin-bottom: 15px;">Click on the map to drop target pins.</p>
        <canvas id="placementCanvas" width="640" height="640"></canvas>
        <button id="launchBtn" class="btn" onclick="launchMission()">LAUNCH MISSION</button>
    </div>

    <!-- SCREEN 3: LIVE SIMULATION -->
    <div id="screen3" class="screen">
        <div class="hud-panel">
            <h3>Mission Telemetry</h3>
            <div class="stat-box">
                <div class="stat-label">Coverage</div>
                <div class="stat-val" id="hudCoverage">0 / 1024</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Victims Found</div>
                <div class="stat-val" id="hudVictims">0 / 0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Elapsed Steps</div>
                <div class="stat-val" id="hudSteps">0</div>
            </div>
            
            <h4>Active Fleet</h4>
            <div id="fleetList" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- Drones populated via JS -->
            </div>
        </div>
        
        <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
            <div id="sim3d"></div>
        </div>
        
        <div class="hud-panel">
            <h3>GPS Target Logs</h3>
            <div class="log-box" id="gpsLogs">
                <!-- GPS logs populated here -->
            </div>
        </div>
    </div>

    <script src="mission.js?v=3"></script>
</body>
</html>
